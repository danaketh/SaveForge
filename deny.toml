[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates deep in iced's renderer stack; no
# maintained alternative is selectable from here. Revisit on iced upgrades.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via wgpu-hal/metal (macOS), unmaintained only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via cosmic-text/fontdb, unmaintained only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
]

[licenses]
confidence-threshold = 0.9
private = { ignore = true }
allow = [
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.exceptions]]
# Dependency of rustls-platform-verifier on wasm32 targets only; never
# compiled into SaveForge (the store crate is native-only).
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
