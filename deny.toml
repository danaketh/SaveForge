[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates deep in iced's renderer stack; no
# maintained alternative is selectable from here. Revisit on iced upgrades.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via wgpu-hal/metal (macOS), unmaintained only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via cosmic-text/fontdb, unmaintained only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via iced_winit/mundy/zbus 5 (Linux), merged into zbus 6, unmaintained only" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: via iced_futures/wasmtimer (wasm32 target only, never built), unmaintained only" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: via iced svg feature/resvg 0.45/usvg, pinned by iced 0.14, unmaintained only" },
    # zstd 0.13 via wasmtime's compile cache (wasmtime-internal-cache 50.0.1
    # requires `^0.13`; the fixes are in 0.14.3 / zstd-safe 8.2). The cache
    # only calls `encode_all`/`decode_all` on files it wrote into our data
    # dir; plugins cannot reach it. Remove once wasmtime moves to zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "zstd raw Encoder/Decoder::with_context: not called (decode_all/encode_all use a fresh context)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe Seekable::decompress: seekable format not used" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe legacy-frame decompress_stream: reached only through corrupt files in our own cache dir" },
]

[licenses]
confidence-threshold = 0.9
private = { ignore = true }
allow = [
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.exceptions]]
# Dependency of rustls-platform-verifier on wasm32 targets only; never
# compiled into SaveForge (the store crate is native-only).
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
