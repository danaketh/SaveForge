[workspace]
resolver = "3"
members = [
    "crates/saveforge-core",
    "crates/saveforge-plugin-api",
    "fixtures/test-plugin",
    "sdk/saveforge-sdk",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
filetime = "0.2.29"
saveforge-core = { path = "crates/saveforge-core" }
saveforge-plugin-api = { path = "crates/saveforge-plugin-api" }
saveforge-sdk = { path = "sdk/saveforge-sdk" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"
wasmtime = { version = "49.0.2", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "std",
    "parallel-compilation",
    "cache",
] }
wasmtime-wasi = "49.0.2"
winreg = "0.56.0"
wit-bindgen = "0.62.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
