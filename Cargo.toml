[workspace]
resolver = "3"
members = [
    "crates/saveforge-app",
    "crates/saveforge-core",
    "crates/saveforge-host",
    "crates/saveforge-plugin-api",
    "crates/saveforge-store",
    "fixtures/test-plugin",
    "plugins/planet-crafter",
    "plugins/sample-stardew",
    "sdk/saveforge-sdk",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
filetime = "0.2.29"
iced = { version = "0.14.0", features = ["tokio", "image"] }
iced_test = "0.14.0"
open = "5.4.4"
regex-lite = "0.1.9"
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
saveforge-core = { path = "crates/saveforge-core" }
saveforge-host = { path = "crates/saveforge-host" }
saveforge-plugin-api = { path = "crates/saveforge-plugin-api" }
saveforge-sdk = { path = "sdk/saveforge-sdk" }
saveforge-store = { path = "crates/saveforge-store" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# `arbitrary_precision` everywhere so plugins and the app behave the same in
# every build (Cargo would otherwise unify it in only when Planet Crafter is
# built alongside).
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ureq = { version = "3.4.2", default-features = false, features = [
    "rustls-no-provider",
    "platform-verifier",
] }
wasmtime = { version = "49.0.4", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "std",
    "parallel-compilation",
    "cache",
] }
wasmtime-wasi = "49.0.4"
winreg = "0.56.0"
wit-bindgen = "0.62.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Dev and test builds load plugins, and an unoptimized Cranelift makes each
# load take seconds. Optimize only the crates that compile wasm; everything
# else stays unoptimized for fast rebuilds.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
