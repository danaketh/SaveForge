name: Release

# A `v*` tag builds the app for each OS, packages the plugins with a catalog
# pointing at this release, and publishes everything as release assets.
# `workflow_dispatch` runs the builds without publishing.
#
# Third-party actions are pinned to commits (the tag they were taken from is
# in the comment), since the publish job holds a write token.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/saveforge.exe
            asset: saveforge-windows-x64.exe
          - os: ubuntu-latest
            binary: target/release/saveforge
            asset: saveforge-linux-x64
          - os: macos-latest
            binary: target/release/saveforge
            asset: saveforge-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p saveforge-app
      - shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  plugins:
    name: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask package --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: target/packages/*

  publish:
    name: publish
    needs: [app, plugins]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
